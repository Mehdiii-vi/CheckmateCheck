<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckmateCheck | موتور تشخیص کیش و مات شطرنج</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
              900: '#1E1B4B',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-amber-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-2xl">
          ♔
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="header-title" class="font-extrabold text-base sm:text-lg tracking-tight text-white">
              CheckmateCheck | موتور تشخیص کیش و مات
            </h1>
            <span class="px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full">
              تحلیل هوشمند
            </span>
          </div>
          <p id="header-subtitle" class="text-xs text-slate-400 hidden sm:block">
            اعتبارسنجی صفحه و تشخیص وضعیت شاه، کیش، مات و پات بدون نیاز به نوبت
          </p>
        </div>
      </div>

      <!-- Action Utilities -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Sound Toggle -->
        <button id="btn-sound-toggle" class="p-1.5 px-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm transition-all" title="Toggle Sound">
          🔊
        </button>

        <!-- Language Toggle -->
        <button id="btn-lang-toggle" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-bold text-indigo-300 transition-all">
          English
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- Left Column: Interactive Chessboard & Piece Tray (7 Cols) -->
    <section class="lg:col-span-7 flex flex-col items-center">
      
      <!-- Top / Side by Side Container: Palette at Top-Left, Board on Right -->
      <div class="w-full flex flex-col md:flex-row items-center md:items-start justify-center gap-4 mb-3" style="direction: ltr;">
        
        <!-- Piece Palette Tray (Docked at Top-Left) -->
        <div class="w-full md:w-auto p-4 sm:p-5 rounded-2xl glass-card border border-slate-800 shadow-xl flex flex-col flex-shrink-0" style="direction: rtl;">
          
          <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-slate-800 text-xs font-bold text-slate-200">
            <span class="flex items-center gap-1.5">
              <span>♟️</span>
              <span>پالت مهره‌ها</span>
            </span>
            <span class="text-indigo-400 font-mono text-[11px]">Palette</span>
          </div>

          <!-- Dual Column Grid: White on right, Black on left -->
          <div class="grid grid-cols-2 gap-3 mb-3.5">
            <!-- White Pieces Column -->
            <div class="flex flex-col items-center gap-2">
              <span class="text-xs font-black text-amber-200 pb-0.5">سفید</span>
              <div id="white-palette-col" class="flex flex-col gap-2"></div>
            </div>

            <!-- Black Pieces Column -->
            <div class="flex flex-col items-center gap-2">
              <span class="text-xs font-black text-slate-300 pb-0.5">سیاه</span>
              <div id="black-palette-col" class="flex flex-col gap-2"></div>
            </div>
          </div>

          <!-- Trash Tool -->
          <button id="palette-trash" class="piece-palette-item w-full py-2.5 px-3 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/50 text-rose-300 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all shadow-sm" title="کلیک کنید تا هر مهره‌ای را در صفحه پاک کنید">
            <span>🗑️</span>
            <span>حذف مهره (سطل زباله)</span>
          </button>
        </div>

        <!-- Chessboard & Buttons Area -->
        <div class="flex flex-col items-center w-full max-w-[480px]">
          <!-- Active Brush / Tool Status Helper Banner -->
          <div id="active-brush-info" class="w-full p-2 mb-2 bg-slate-900/90 rounded-xl border border-slate-800 text-xs text-center transition-all" style="direction: rtl;">
            <span class="text-slate-400">یک مهره از پالت انتخاب کنید یا مهره‌ها را با ماوس به داخل صفحه بکشید.</span>
          </div>

          <!-- Chessboard Container with SVG Threat Overlay -->
          <div class="chessboard-container mb-3">
            <div id="chessboard"></div>
            <svg id="threat-overlay" class="threat-overlay-svg"></svg>
          </div>

          <!-- Action Buttons Bar -->
          <div class="w-full grid grid-cols-2 gap-2.5" style="direction: rtl;">
            <!-- Main Analyze CTA Button -->
            <button id="btn-analyze" class="py-2.5 px-4 bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 transform active:scale-95 cursor-pointer">
              <span class="text-base">⚡</span>
              <span id="btn-analyze-text">بررسی وضعیت صفحه (Analyze)</span>
            </button>

            <!-- Clear Board Button -->
            <button id="btn-clear" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs sm:text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 cursor-pointer">
              <span>🧹</span>
              <span id="btn-clear-text">صفحه خالی (Clear)</span>
            </button>
          </div>
        </div>

      </div>

    </section>

    <!-- Right Column: Analytics & Diagnostics Dashboard (5 Cols) -->
    <aside class="lg:col-span-5 w-full">
      <div class="sticky top-20 space-y-4">
        <!-- Panel Header -->
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
          <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span>پنل تشخیص و گزارش وضعیت صفحه</span>
          </h2>
          <span class="text-[11px] font-mono text-indigo-400">Deterministic Engine</span>
        </div>

        <!-- Diagnostics Output Container -->
        <div id="diagnostics-container">
          <!-- Dynamically populated via JS -->
        </div>
      </div>
    </aside>

  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/api.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
